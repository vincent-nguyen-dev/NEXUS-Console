# Netlify: the Vite build in dist/. Node comes from .nvmrc.
# Data is read from Northstar's ops feed on Render, the only origin connect-src allows.
[build]
  command = "npm run build"
  publish = "dist"
  # Each production deploy costs 15 of the Free plan's 300 monthly credits (docs/operations.md). Skip the build when a
  # push changes nothing the site is built from: only docs, Markdown, Claude's notes or CI (step 7.2b). git diff exits
  # 0 when nothing else changed, which tells Netlify to cancel; if it can't compare (a first build), the build runs.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)docs/' ':(exclude)*.md' ':(exclude).claude/' ':(exclude).github/'"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; connect-src 'self' https://northstar-digital-api.onrender.com; img-src 'self' data:; style-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Vite names every file in /assets by its content hash, so a changed file gets a new name: cache them for a year
# (step 7.1d, F15). index.html and the files in public/ keep Netlify's default (revalidate every time).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The console lives at /console, the guided story at /story, the developer page at /connect, and the landing pages at
# /, /how and /work. It's the same index.html; src/main.tsx
# picks the page. A 200 rewrite keeps the URL and its query.
[[redirects]]
  from = "/console"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/console/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/story"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/story/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/connect"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/connect/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/how"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/how/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/work"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/work/"
  to = "/index.html"
  status = 200

# Vite fingerprints everything under /assets, so it can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
